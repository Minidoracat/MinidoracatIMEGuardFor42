[package]
name = "pz-ime-guard"
version = "0.1.0"
edition = "2024"
description = "Companion tray tool for MinidoracatIMEGuardFor42: keeps Project Zomboid on an English keyboard layout while playing and restores your IME while typing"
license = "MIT"
publish = false

[dependencies]
tray-icon = "0.25"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.31"
