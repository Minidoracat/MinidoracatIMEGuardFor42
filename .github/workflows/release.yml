# 推 v* tag 時：在乾淨的 Windows runner 編 pz-ime-guard.exe → 建／更新同名 Release 並附檔 → 送 VirusTotal → 把掃描連結寫回 Release 說明。
# 流程：git tag v<modversion> && git push origin v<modversion>，其餘全自動；Release 說明可事後在網頁補寫。
# 需要 repo secret VT_API_KEY（VirusTotal 帳號 → API key；免費額度 4 次/分、500 次/天）。
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        run: |
          cargo build --release --manifest-path tools/pz-ime-guard/Cargo.toml
          cargo test --release --manifest-path tools/pz-ime-guard/Cargo.toml
      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash tools/pz-ime-guard/target/release/pz-ime-guard.exe -Algorithm SHA256).Hash + "  pz-ime-guard.exe" | Out-File -Encoding ascii pz-ime-guard.exe.sha256
      - name: Release notes from CHANGELOG
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # 取 CHANGELOG.md 裡 `## [<modversion>]` 那一節（到下一個 ## 前），找不到就只放版本標題
          $ver = $env:TAG.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -like "## [$ver]*" })
          if ($start -lt 0) { $section = @("## $ver") } else {
            $end = $start + 1; while ($end -lt $lines.Count -and $lines[$end] -notlike '## *') { $end++ }
            $section = $lines[$start..($end - 1)]
          }
          $section += ""; $section += "Workshop：https://steamcommunity.com/sharedfiles/filedetails/?id=3802890539"
          $section += "**只訂閱 MOD 不會有效果**，請下載下方 Assets 的 `pz-ime-guard.exe` 執行（未簽章，SmartScreen 出現時按「其他資訊 → 仍要執行」）。"
          Set-Content -Path release-notes.md -Encoding utf8 -Value ($section -join "`n")
      - name: Create or update release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            tools/pz-ime-guard/target/release/pz-ime-guard.exe
            pz-ime-guard.exe.sha256
      - name: VirusTotal scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: tools/pz-ime-guard/target/release/pz-ime-guard.exe
      - name: Append VirusTotal link to release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
          TAG: ${{ github.ref_name }}
        run: |
          $links = ($env:ANALYSIS -split ',') | ForEach-Object { $n, $u = $_ -split '=', 2; "- [查看 $(Split-Path $n -Leaf) 的 VirusTotal 報告]($u)" }
          $body = (gh release view $env:TAG --json body -q .body) -join "`n"
          Set-Content -Path notes.md -Encoding utf8 -Value ($body.TrimEnd() + "`n`n### VirusTotal 掃描報告（不是下載連結，exe 請從下方 Assets 取得）`n" + ($links -join "`n"))
          gh release edit $env:TAG --notes-file notes.md
